<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200"><style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes swing{0%{opacity:0;transform:translateY(24px)}70%{transform:translateY(-4px)}100%{opacity:1;transform:none}}
.a{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .35s ease-out forwards}
.g{transform-box:fill-box;transform-origin:bottom;animation:grow .7s ease-out both}
.s{opacity:0;animation:swing .8s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style><rect width="840" height="200" rx="14" fill="#0d1117" stroke="#30363d"/><defs><linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0"><stop offset="0" stop-color="#e6edf3"/><stop offset=".5" stop-color="#6c8cff"/><stop offset="1" stop-color="#e6edf3"/><animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="700 0" dur="3.5s" begin="1s" repeatCount="indefinite"/></linearGradient></defs>
<circle cx="760" cy="40" r="120" fill="#6c8cff" fill-opacity=".08"/>
<text class="a" x="40" y="70" font-size="14" fill="#6c8cff" letter-spacing="3" style="animation-delay:.1s">BONJOUR, JE SUIS</text>
<text class="a" x="40" y="130" font-size="58" font-weight="700" fill="url(#sh)" style="animation-delay:.3s">M4xxes</text>
<text class="a" x="40" y="168" font-size="18" fill="#8b949e" style="animation-delay:.6s">Dev / Prog · Étudiant à Ynov Campus, Lyon</text></svg>